<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" id="temporal-resolution" aria-labelledby="temporal-resolution-title temporal-resolution-desc">
<title id="temporal-resolution-title">Information loss at coarser temporal resolution</title>
<desc id="temporal-resolution-desc">Recall, missed canonical transitions, missed conflict episodes, and mean date error are compared for 7-day, monthly, and quarterly endpoint grids.</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.title { font-size: 30px; font-weight: 700; letter-spacing: -0.3px; }
.subtitle { font-size: 15px; fill: #5B6775; }
.panel-title { font-size: 17px; font-weight: 700; }
.axis { font-size: 12px; fill: #5B6775; }
.label { font-size: 14px; }
.value { font-size: 13px; font-weight: 650; }
.small { font-size: 11px; fill: #5B6775; }
.note { font-size: 13px; fill: #5B6775; }
.matrix-column-label { font-size: 12px; fill: #5B6775; }
.grid { stroke: #D8DEE6; stroke-width: 1; }
.axis-line { stroke: #8A96A3; stroke-width: 1; }</style>
<rect width="1200" height="660" fill="#FFFFFF"/>
<text x="56" y="48" fill="#17212B" class="title">Information loss at coarser temporal resolution</text>
<text x="56" y="75" fill="#17212B" class="subtitle">Release-level history preserves transient and recurrent episodes hidden between endpoints.</text>
<text x="250" y="112" fill="#17212B" class="panel-title" text-anchor="middle">Transition recall</text>
<text x="870" y="112" fill="#17212B" class="panel-title" text-anchor="middle">Episodes missed between endpoints</text>
